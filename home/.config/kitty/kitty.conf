# vim:fileencoding=utf-8:foldmethod=marker

# 字体 ==================================================
# 使用 JetBrainsMono Nerd Font（包含 Powerline、图标等）
font_family      family="JetBrainsMono Nerd Font Mono"
bold_font        auto
italic_font      auto
bold_italic_font auto
font_size        16

# 外观 ==================================================
# 背景透明度（0=完全透明，1=完全不透明）
background_opacity 0.8
# 背景模糊半径（macOS 上推荐 16-64，需 background_opacity < 1）
background_blur 32

# macOS 优化 ============================================
# Option 键作为 Alt 键（避免 macOS 默认 Unicode 输入干扰）
macos_option_as_alt left
# 隐藏 macOS 窗口标题栏（保留阴影以支持边缘拖动缩放）
hide_window_decorations titlebar-only
# 窗口标题栏颜色使用主题背景色
macos_titlebar_color background

# 窗口布局 ==============================================
# 记住上次窗口大小
remember_window_size yes
# 初始窗口大小（以单元格为单位，自适应分辨率）
initial_window_width  120c
initial_window_height 36c
# 窗口内边距：左 右 顶 底
window_padding_width 8 8 4 4
# 多窗口时显示最小化边框
window_border_width 1pt
draw_minimal_borders yes

# 滚动与选择 ============================================
# 按像素滚动（macOS 触控板友好）
pixel_scroll yes
# 回滚缓冲行数
scrollback_lines 10000
# 选中文本自动复制到剪贴板（macOS 没有 primary selection）
copy_on_select clipboard
# 智能去除行尾空格
strip_trailing_spaces smart

# 标签栏 ================================================
# 标签栏在底部
tab_bar_edge bottom
# 至少 2 个标签才显示
tab_bar_min_tabs 2
# 标签栏样式（淡入淡出）
tab_bar_style fade

# Shell 集成 ============================================
# 启用 shell 集成（跳转 prompt、查看命令输出等）
shell_integration enabled

# 主题 ==================================================
# Catppuccin-Frappe
include current-theme.conf
